amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: npu_robot/base_link
    odom_frame_id: npu_robot/odom
    global_frame_id: world
    scan_topic: /npu/robot/scan
    transform_tolerance: 0.5
    initial_pose:
      x: 2.5
      y: -1.5
      z: 0.0
      yaw: 0.0
    set_initial_pose: true
    min_particles: 500
    max_particles: 2000
    laser_min_range: 0.12
    laser_max_range: 8.0
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    tf_broadcast: true

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: world
    yaml_filename: ""

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /npu/robot/odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.6
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: true
      use_collision_regulated_linear_velocity_scaling: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: npu_robot/odom
      robot_base_frame: npu_robot/base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.08, 0.06], [0.08, -0.06], [-0.08, -0.06], [-0.08, 0.06]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /npu/robot/scan
          data_type: LaserScan
          robot_base_frame: npu_robot/base_link
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.5
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: world
      robot_base_frame: npu_robot/base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.08, 0.06], [0.08, -0.06], [-0.08, -0.06], [-0.08, 0.06]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /npu/robot/scan
          data_type: LaserScan
          robot_base_frame: npu_robot/base_link
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.5
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: npu_robot/odom
    global_frame: world
    robot_base_frame: npu_robot/base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: world
    robot_base_frame: npu_robot/base_link
    odom_topic: /npu/robot/odom
    transform_tolerance: 0.5
    server_timeout: 2000

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [map_server, amcl, controller_server, planner_server, behavior_server, bt_navigator]
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
